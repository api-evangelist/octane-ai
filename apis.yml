name: Octane AI
description: >-
  Octane AI is an AI-powered quiz and product-recommendation platform for Shopify
  merchants, turning storefront browsers into buyers with no-code personalized
  quizzes, zero-party data capture, and its CORE-1 recommendation engine. It
  integrates with 50+ marketing, CRM, and automation tools (Klaviyo, Attentive,
  Postscript, Recharge, Gorgias, Zapier, Alloy) and syncs shopper data in real
  time. Its developer surface is client-side rather than a public REST API: an
  embeddable quiz widget that dispatches a documented set of browser JavaScript
  events (octane.quiz.*), custom CSS/JS injection hooks, a headless-store
  integration path, and a per-account API key plus webhook secret used for
  integrations and outbound webhook verification. Backed by Bullpen Capital and
  General Catalyst.
